name: Release

on:
  push:
    branches: [main]
    paths:
      - 'release-note.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.parse.outputs.items }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Parse Release Note
        id: parse
        run: |
          if [ -f "release-note.md" ]; then
            ITEMS=$(node .github/scripts/parse-release-note.js release-note.md)
            echo "Parsed items: $ITEMS"
            echo "items=$ITEMS" >> $GITHUB_OUTPUT
          else
            echo "release-note.md not found, skipping."
            echo "items=[]" >> $GITHUB_OUTPUT
            exit 1
          fi

  verify:
    needs: prepare
    if: needs.prepare.outputs.items != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check Package Consistency
        run: npm run check-consistency

      - name: Check Base i18n
        run: npm run check-base-i18n

      - name: Smoke Apply
        run: npm run smoke-apply

      - name: Build Documentation
        run: npm run docs:build

      - name: Security Audit
        run: npm audit --audit-level=high --omit=dev

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.items != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ITEMS: ${{ needs.prepare.outputs.items }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.6.2

      - name: Publish
        run: node .github/scripts/publish-batch.js
